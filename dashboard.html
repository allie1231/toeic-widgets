<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="TOEIC 900 학습 현황을 한눈에 보는 생산성 대시보드">
  <title>TOEIC 900 Dashboard</title>
  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <script src="assets/js/animation.js" defer></script>
  <script src="assets/js/common.js" defer></script>
</head>
<body class="dashboard-page">
  <a class="skip-link" href="#widgets">위젯으로 건너뛰기</a>
  <div class="dashboard-shell">
    <header class="dashboard-header" data-animate>
      <div>
        <p class="dashboard-kicker">TOEIC 900 Project</p>
        <h1 class="dashboard-title">Study Dashboard</h1>
        <p class="dashboard-subtitle">725 → 900 · LC는 지키고 RC를 뚫는다.</p>
      </div>
      <span class="dashboard-badge">학습 데이터 최신</span>
    </header>

    <main class="dashboard-grid" id="widgets" aria-label="TOEIC 학습 위젯">
      <section class="dashboard-panel" data-animate><h2 class="sr-only">목표 점수 진행률</h2><iframe class="dashboard-frame" src="widgets/hero.html" title="목표 점수 진행률" loading="eager"></iframe></section>
      <section class="dashboard-panel" data-animate><h2 class="sr-only">AI 코치</h2><iframe class="dashboard-frame dashboard-frame--tall" src="widgets/coach.html" title="AI 코치" loading="eager"></iframe></section>
      <section class="dashboard-panel" data-animate><h2 class="sr-only">취약 영역</h2><iframe class="dashboard-frame" src="widgets/weak-skills.html" title="취약 영역" loading="lazy"></iframe></section>
      <section class="dashboard-panel" data-animate><h2 class="sr-only">점수 목표</h2><iframe class="dashboard-frame" src="widgets/goals.html" title="점수 목표" loading="lazy"></iframe></section>
      <section class="dashboard-panel" data-animate><h2 class="sr-only">학습 시간</h2><iframe class="dashboard-frame" src="widgets/study-time.html" title="학습 시간" loading="lazy"></iframe></section>
      <section class="dashboard-panel" data-animate><h2 class="sr-only">점수 예측</h2><iframe class="dashboard-frame" src="widgets/forecast.html" title="점수 예측" loading="lazy"></iframe></section>
      <section class="dashboard-panel" data-animate><h2 class="sr-only">학습 히트맵</h2><iframe class="dashboard-frame dashboard-frame--compact" src="widgets/heatmap.html" title="학습 히트맵" loading="lazy"></iframe></section>
      <section class="dashboard-panel" data-animate><h2 class="sr-only">RC 풀이 속도</h2><iframe class="dashboard-frame dashboard-frame--tall" src="widgets/rc-speed.html" title="RC 풀이 속도" loading="lazy"></iframe></section>
      <section class="dashboard-panel" data-animate><h2 class="sr-only">파트별 정답률</h2><iframe class="dashboard-frame dashboard-frame--compact" src="widgets/accuracy.html" title="파트별 정답률" loading="lazy"></iframe></section>
      <section class="dashboard-panel" data-animate><h2 class="sr-only">연속 학습</h2><iframe class="dashboard-frame" src="widgets/streak.html" title="연속 학습" loading="lazy"></iframe></section>
    </main>
  </div>
</body>
</html>
