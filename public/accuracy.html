<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>Accuracy</title><style>:root{--bg:rgba(255,255,255,.78);--line:rgba(15,23,42,.09);--text:#111827;--muted:#6b7280;--track:rgba(17,24,39,.08);--a:#7c3aed;--b:#2563eb}@media(prefers-color-scheme:dark){:root{--bg:rgba(18,18,22,.8);--line:rgba(255,255,255,.1);--text:#f7f7f8;--muted:#a1a1aa;--track:rgba(255,255,255,.1)}}*{box-sizing:border-box}body{margin:0;padding:8px;background:transparent;font-family:-apple-system,BlinkMacSystemFont,"Pretendard",sans-serif;color:var(--text)}.card{max-width:440px;margin:auto;padding:22px;border:1px solid var(--line);border-radius:24px;background:var(--bg);backdrop-filter:blur(22px);box-shadow:0 18px 44px rgba(15,23,42,.1)}h1{margin:0 0 18px;font-size:13px;letter-spacing:.12em;color:var(--muted)}.item{display:grid;grid-template-columns:42px 1fr 48px;gap:12px;align-items:center;margin:15px 0}.part{font-weight:780}.bar{height:10px;border-radius:999px;background:var(--track);overflow:hidden}.fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--a),var(--b));animation:grow 1s cubic-bezier(.22,1,.36,1)}.value{text-align:right;font-weight:760}@keyframes grow{from{width:0}}</style></head><body><main class="card"><h1>ACCURACY</h1><div class="item"><div class="part">P5</div><div class="bar"><div class="fill" style="width:92%"></div></div><div class="value">92%</div></div><div class="item"><div class="part">P6</div><div class="bar"><div class="fill" style="width:84%"></div></div><div class="value">84%</div></div><div class="item"><div class="part">P7</div><div class="bar"><div class="fill" style="width:73%"></div></div><div class="value">73%</div></div></main></body></html>
