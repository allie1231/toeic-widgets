<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>TOEIC AI Coach</title>
  <style>
    :root {
      --bg: rgba(255,255,255,.82);
      --line: rgba(15,23,42,.09);
      --text: #111827;
      --muted: #6b7280;
      --soft: rgba(15,23,42,.055);
      --accent: #7c3aed;
      --shadow: 0 18px 44px rgba(15,23,42,.10);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: rgba(18,18,22,.82);
        --line: rgba(255,255,255,.10);
        --text: #f7f7f8;
        --muted: #a1a1aa;
        --soft: rgba(255,255,255,.07);
        --shadow: 0 18px 44px rgba(0,0,0,.30);
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: transparent; }
    body {
      display: grid;
      place-items: center;
      padding: 8px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Pretendard", "Segoe UI", sans-serif;
      color: var(--text);
    }
    .card {
      width: min(100%, 440px);
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background:
        radial-gradient(circle at 90% 12%, rgba(124,58,237,.17), transparent 30%),
        var(--bg);
      box-shadow: var(--shadow);
      backdrop-filter: blur(22px) saturate(140%);
      -webkit-backdrop-filter: blur(22px) saturate(140%);
    }
    .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .label { font-size: 12px; font-weight: 800; letter-spacing: .12em; color: var(--muted); }
    .time { font-size: 12px; color: var(--muted); }
    .focus { margin-top: 18px; display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; }
    .skill { font-size: clamp(34px, 12vw, 54px); line-height: 1; font-weight: 830; letter-spacing: -.055em; }
    .minutes { flex: 0 0 auto; padding: 10px 12px; border-radius: 14px; background: var(--soft); border: 1px solid var(--line); font-size: 14px; font-weight: 750; }
    .mission { margin-top: 18px; padding: 15px 16px; border-radius: 18px; background: var(--soft); border: 1px solid var(--line); }
    .mission-title { font-size: 11px; font-weight: 800; letter-spacing: .09em; color: var(--muted); }
    .mission-text { margin-top: 8px; font-size: 15px; line-height: 1.55; font-weight: 650; }
    .meta { margin-top: 14px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .meta-item { padding: 10px; border-radius: 14px; border: 1px solid var(--line); background: rgba(255,255,255,.03); }
    .meta-key { font-size: 10px; color: var(--muted); }
    .meta-value { margin-top: 4px; font-size: 13px; font-weight: 760; }
  </style>
</head>
<body>
  <main class="card" aria-label="오늘의 TOEIC 코칭">
    <div class="top">
      <div class="label">AI COACH · TODAY</div>
      <div class="time">2026.08.04</div>
    </div>

    <section class="focus">
      <div class="skill">형용사</div>
      <div class="minutes">25 min</div>
    </section>

    <section class="mission">
      <div class="mission-title">TODAY'S MISSION</div>
      <div class="mission-text">형용사 품사자리 오답을 복습하고 P5 20초 타임어택 10문제를 풉니다.</div>
    </section>

    <section class="meta">
      <div class="meta-item">
        <div class="meta-key">REVIEW</div>
        <div class="meta-value">1문제</div>
      </div>
      <div class="meta-item">
        <div class="meta-key">PACE</div>
        <div class="meta-value">수집 중</div>
      </div>
      <div class="meta-item">
        <div class="meta-key">FOCUS</div>
        <div class="meta-value">P5</div>
      </div>
    </section>
  </main>
</body>
</html>
