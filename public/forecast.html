<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>Forecast</title><style>:root{--bg:rgba(255,255,255,.78);--line:rgba(15,23,42,.09);--text:#111827;--muted:#6b7280;--a:#7c3aed;--b:#2563eb}@media(prefers-color-scheme:dark){:root{--bg:rgba(18,18,22,.8);--line:rgba(255,255,255,.1);--text:#f7f7f8;--muted:#a1a1aa}}*{box-sizing:border-box}body{margin:0;padding:8px;background:transparent;font-family:-apple-system,BlinkMacSystemFont,"Pretendard",sans-serif;color:var(--text)}.card{max-width:440px;margin:auto;padding:22px;border:1px solid var(--line);border-radius:24px;background:var(--bg);backdrop-filter:blur(22px);box-shadow:0 18px 44px rgba(15,23,42,.1)}h1{margin:0;font-size:13px;letter-spacing:.12em;color:var(--muted)}.score{margin-top:18px;font-size:60px;line-height:1;font-weight:820;letter-spacing:-.06em}.sub{margin-top:8px;color:var(--muted);font-size:13px}.chart{position:relative;height:92px;margin-top:18px}.chart svg{width:100%;height:100%;overflow:visible}.line{fill:none;stroke:url(#g);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:400;stroke-dashoffset:400;animation:draw 1.2s ease forwards}.area{fill:url(#area);opacity:.25}.dot{fill:var(--b)}@keyframes draw{to{stroke-dashoffset:0}}</style></head><body><main class="card"><h1>SCORE FORECAST</h1><div class="score">785</div><div class="sub">최근 학습 추세 기준 · 예상 점수</div><div class="chart"><svg viewBox="0 0 360 90" preserveAspectRatio="none"><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#2563eb"/></linearGradient><linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#2563eb" stop-opacity="0"/></linearGradient></defs><path class="area" d="M0 76 L72 66 L144 58 L216 42 L288 28 L360 14 L360 90 L0 90Z"/><path class="line" d="M0 76 L72 66 L144 58 L216 42 L288 28 L360 14"/><circle class="dot" cx="360" cy="14" r="5"/></svg></div></main></body></html>
