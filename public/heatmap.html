<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>Heatmap</title><style>:root{--bg:rgba(255,255,255,.78);--line:rgba(15,23,42,.09);--text:#111827;--muted:#6b7280;--empty:rgba(17,24,39,.08);--c1:#ddd6fe;--c2:#a78bfa;--c3:#7c3aed;--c4:#4f46e5}@media(prefers-color-scheme:dark){:root{--bg:rgba(18,18,22,.8);--line:rgba(255,255,255,.1);--text:#f7f7f8;--muted:#a1a1aa;--empty:rgba(255,255,255,.08);--c1:#312e81;--c2:#5b21b6;--c3:#7c3aed;--c4:#6366f1}}*{box-sizing:border-box}body{margin:0;padding:8px;background:transparent;font-family:-apple-system,BlinkMacSystemFont,"Pretendard",sans-serif;color:var(--text)}.card{max-width:440px;margin:auto;padding:22px;border:1px solid var(--line);border-radius:24px;background:var(--bg);backdrop-filter:blur(22px);box-shadow:0 18px 44px rgba(15,23,42,.1)}h1{margin:0;font-size:13px;letter-spacing:.12em;color:var(--muted)}.meta{display:flex;justify-content:space-between;margin-top:12px;font-size:13px}.grid{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,12px);grid-auto-columns:12px;gap:5px;margin-top:20px;overflow:hidden}.cell{border-radius:3px;background:var(--empty);animation:pop .5s ease both}.l1{background:var(--c1)}.l2{background:var(--c2)}.l3{background:var(--c3)}.l4{background:var(--c4)}@keyframes pop{from{transform:scale(.4);opacity:0}}</style></head><body><main class="card"><h1>STUDY HEATMAP</h1><div class="meta"><strong>24일 학습</strong><span style="color:var(--muted)">최근 8주</span></div><div class="grid" id="grid"></div></main><script>const levels=[0,1,2,0,3,0,1,2,2,0,4,1,0,3,1,2,0,0,4,2,1,3,2,0,1,4,3,1,0,2,2,3,4,1,0,0,2,3,1,4,2,1,3,0,4,2,3,1,2,4,0,3,2,1,4,3];document.getElementById('grid').innerHTML=levels.map((v,i)=>`<i class="cell ${v?'l'+v:''}" style="animation-delay:${i*8}ms"></i>`).join('');</script></body></html>
