<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>TOEIC 900 Progress</title>
  <style>
    :root {
      --bg: rgba(255,255,255,.78);
      --line: rgba(15,23,42,.09);
      --text: #111827;
      --muted: #6b7280;
      --track: rgba(17,24,39,.08);
      --accent-a: #7c3aed;
      --accent-b: #2563eb;
      --shadow: 0 18px 44px rgba(15,23,42,.10);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: rgba(18,18,22,.78);
        --line: rgba(255,255,255,.10);
        --text: #f7f7f8;
        --muted: #a1a1aa;
        --track: rgba(255,255,255,.10);
        --shadow: 0 18px 44px rgba(0,0,0,.30);
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: transparent; }
    body {
      display: grid;
      place-items: center;
      padding: 8px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Pretendard", "Segoe UI", sans-serif;
      color: var(--text);
    }
    .card {
      width: min(100%, 440px);
      min-height: 214px;
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background:
        radial-gradient(circle at 88% 8%, rgba(124,58,237,.20), transparent 30%),
        radial-gradient(circle at 8% 100%, rgba(37,99,235,.16), transparent 34%),
        var(--bg);
      box-shadow: var(--shadow);
      backdrop-filter: blur(22px) saturate(140%);
      -webkit-backdrop-filter: blur(22px) saturate(140%);
      overflow: hidden;
    }
    .top { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .eyebrow { font-size: 12px; font-weight: 750; letter-spacing: .12em; color: var(--muted); }
    .pill { padding: 7px 10px; border: 1px solid var(--line); border-radius: 999px; font-size: 11px; color: var(--muted); background: rgba(255,255,255,.08); }
    .score { margin-top: 20px; display: flex; align-items: flex-end; gap: 10px; }
    .current { font-size: clamp(42px, 14vw, 64px); line-height: .9; font-weight: 820; letter-spacing: -.06em; }
    .arrow { padding-bottom: 6px; font-size: 20px; color: var(--muted); }
    .target { padding-bottom: 5px; font-size: 22px; font-weight: 760; color: var(--muted); }
    .bar { margin-top: 22px; height: 12px; border-radius: 999px; background: var(--track); overflow: hidden; }
    .fill { height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, var(--accent-a), var(--accent-b)); box-shadow: 0 0 22px rgba(99,102,241,.45); transition: width 1.15s cubic-bezier(.22,1,.36,1); }
    .bottom { margin-top: 12px; display: flex; justify-content: space-between; align-items: center; gap: 14px; }
    .percent { font-size: 15px; font-weight: 760; }
    .remaining { font-size: 13px; color: var(--muted); }
  </style>
</head>
<body>
  <main class="card" aria-label="TOEIC 목표 점수 진행률">
    <div class="top">
      <div class="eyebrow">TOEIC 900 PROJECT</div>
      <div class="pill">RC FOCUS</div>
    </div>
    <div class="score">
      <div class="current" id="current">0</div>
      <div class="arrow">→</div>
      <div class="target" id="target">900</div>
    </div>
    <div class="bar" aria-hidden="true"><div class="fill" id="fill"></div></div>
    <div class="bottom">
      <div class="percent" id="percent">0%</div>
      <div class="remaining" id="remaining">175 points left</div>
    </div>
  </main>
  <script>
    const config = { current: 725, target: 900 };
    const progress = Math.max(0, Math.min(100, config.current / config.target * 100));
    const currentEl = document.getElementById('current');
    const targetEl = document.getElementById('target');
    const percentEl = document.getElementById('percent');
    const remainingEl = document.getElementById('remaining');
    const fillEl = document.getElementById('fill');
    targetEl.textContent = config.target;
    remainingEl.textContent = `${config.target - config.current} points left`;
    const start = performance.now();
    const duration = 950;
    function animate(now) {
      const t = Math.min(1, (now - start) / duration);
      const eased = 1 - Math.pow(1 - t, 3);
      currentEl.textContent = Math.round(config.current * eased);
      percentEl.textContent = `${(progress * eased).toFixed(1)}%`;
      if (t < 1) requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);
    requestAnimationFrame(() => { fillEl.style.width = `${progress}%`; });
  </script>
</body>
</html>
