<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PACE</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="./style.css">
<style>
  .head { display: flex; justify-content: space-between; align-items: baseline; }
  .latest { display: flex; justify-content: space-between; align-items: baseline; margin-top: 6px; margin-bottom: 8px; }
  .latest .val { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
  .latest .val small { font-size: 11px; font-weight: 400; color: var(--ink-mute); margin-left: 3px; }
  .latest .cap { font-size: 10px; color: var(--ink-mute); text-transform: uppercase; letter-spacing: 0.12em; font-weight: 600; }
  #chart { width: 100%; height: 90px; display: block; }
  .foot { font-size: 10px; color: var(--ink-mute); margin-top: 4px; }
  .empty { text-align: center; padding: 30px 0; font-size: 12px; color: var(--ink-mute); }
</style>
</head>
<body>
<div class="head">
  <div class="label">TOEIC · PACE</div>
  <button class="refresh" onclick="load()">↻</button>
</div>

<div id="body">
  <div class="latest">
    <div>
      <div class="cap">RC 잔여시간</div>
      <div class="val num"><span id="latest">—</span><small>min</small></div>
    </div>
    <div class="cap num" id="verdict">—</div>
  </div>
  <svg id="chart" viewBox="0 0 400 90" preserveAspectRatio="none"></svg>
  <div class="foot">음수 = 속도 문제 · 0~+3분 정상 · +5분 이상 = 정확도 문제</div>
</div>

<script>
async function load() {
  try {
    const r = await fetch('./data/pace.json?t=' + Date.now());
    const d = await r.json();
    const pts = d.points || [];
    if (pts.length === 0) {
      document.getElementById('body').innerHTML =
        '<div class="empty">아직 모의고사 기록이 없습니다</div>';
      return;
    }
    const last = pts[pts.length - 1].rem;
    document.getElementById('latest').textContent = (last > 0 ? '+' : '') + last;
    const v = last < 0 ? '속도 부족' : last <= 3 ? '정상 궤도' : '정확도 점검';
    document.getElementById('verdict').textContent = v;

    // SVG 라인 렌더
    const svg = document.getElementById('chart');
    svg.innerHTML = '';
    const W = 400, H = 90, PAD = 8;
    const vals = pts.map(p => p.rem);
    const min = Math.min(...vals, -5);
    const max = Math.max(...vals, 5);
    const range = max - min || 1;
    const step = pts.length > 1 ? (W - PAD * 2) / (pts.length - 1) : 0;
    const y = v => PAD + (H - PAD * 2) * (1 - (v - min) / range);

    // 0선
    const zeroY = y(0);
    const zero = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    zero.setAttribute('x1', PAD); zero.setAttribute('x2', W - PAD);
    zero.setAttribute('y1', zeroY); zero.setAttribute('y2', zeroY);
    zero.setAttribute('stroke', '#E4EBF1'); zero.setAttribute('stroke-dasharray', '3 3');
    svg.appendChild(zero);

    // 라인
    if (pts.length > 1) {
      const path = pts.map((p, i) => `${i === 0 ? 'M' : 'L'} ${PAD + i * step} ${y(p.rem)}`).join(' ');
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      line.setAttribute('d', path);
      line.setAttribute('fill', 'none');
      line.setAttribute('stroke', '#7B98AE');
      line.setAttribute('stroke-width', '1.8');
      line.setAttribute('stroke-linejoin', 'round');
      line.setAttribute('stroke-linecap', 'round');
      svg.appendChild(line);
    }

    // 포인트
    pts.forEach((p, i) => {
      const cx = PAD + i * step;
      const cy = y(p.rem);
      const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      c.setAttribute('cx', cx); c.setAttribute('cy', cy);
      c.setAttribute('r', i === pts.length - 1 ? 3.5 : 2.5);
      c.setAttribute('fill', i === pts.length - 1 ? '#E8CE96' : '#7B98AE');
      svg.appendChild(c);
    });
  } catch (e) {
    document.getElementById('body').innerHTML = '<div class="err">불러오기 실패</div>';
  }
}
load();
</script>
</body>
</html>
