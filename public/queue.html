<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QUEUE</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="./style.css">
<style>
  .head { display: flex; justify-content: space-between; align-items: baseline; }
  .center { text-align: center; padding: 14px 0 6px; }
  .big { font-size: 56px; font-weight: 700; line-height: 1; letter-spacing: -0.02em; }
  .caption { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-mute); margin-top: 6px; font-weight: 600; }
  .split { display: flex; justify-content: center; gap: 18px; font-size: 12px; margin-top: 12px; }
  .split span { display: inline-flex; align-items: baseline; gap: 5px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
  .dot.lc { background: var(--lc); }
  .dot.rc { background: var(--rc); }
  .empty { text-align: center; padding: 20px 0; font-size: 12px; color: var(--ink-mute); }
</style>
</head>
<body>
<div class="head">
  <div class="label">TOEIC · QUEUE</div>
  <button class="refresh" onclick="load()">↻</button>
</div>

<div id="body">
  <div class="center">
    <div class="big num" id="total">—</div>
    <div class="caption">오늘 복습</div>
  </div>
  <div class="split num">
    <span><i class="dot rc"></i>RC <span id="rc">—</span></span>
    <span><i class="dot lc"></i>LC <span id="lc">—</span></span>
  </div>
</div>

<script>
async function load() {
  try {
    const r = await fetch('./data/queue.json?t=' + Date.now());
    const d = await r.json();
    if (!d.hasAny) {
      document.getElementById('body').innerHTML =
        '<div class="empty">오답이 아직 없습니다<br><span style="color:var(--ink-mute);font-size:10px">채점 후 등록해보세요</span></div>';
      return;
    }
    document.getElementById('total').textContent = d.total;
    document.getElementById('rc').textContent = d.rc;
    document.getElementById('lc').textContent = d.lc;
    if (d.total === 0) {
      document.querySelector('.caption').textContent = '오늘 복습 없음 · 잘 하고 있어요';
    }
  } catch (e) {
    document.getElementById('body').innerHTML = '<div class="err">불러오기 실패</div>';
  }
}
load();
</script>
</body>
</html>
