<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>RC Speed</title><style>:root{--bg:rgba(255,255,255,.78);--line:rgba(15,23,42,.09);--text:#111827;--muted:#6b7280;--good:#16a34a;--warn:#f59e0b}@media(prefers-color-scheme:dark){:root{--bg:rgba(18,18,22,.8);--line:rgba(255,255,255,.1);--text:#f7f7f8;--muted:#a1a1aa}}*{box-sizing:border-box}body{margin:0;padding:8px;background:transparent;font-family:-apple-system,BlinkMacSystemFont,"Pretendard",sans-serif;color:var(--text)}.card{max-width:440px;margin:auto;padding:22px;border:1px solid var(--line);border-radius:24px;background:var(--bg);backdrop-filter:blur(22px);box-shadow:0 18px 44px rgba(15,23,42,.1)}h1{margin:0 0 18px;font-size:13px;letter-spacing:.12em;color:var(--muted)}.row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-top:1px solid var(--line)}.row:first-of-type{border-top:0}.part{font-weight:780}.time{font-size:24px;font-weight:820;letter-spacing:-.04em}.tag{font-size:11px;padding:6px 8px;border-radius:999px;background:rgba(22,163,74,.12);color:var(--good)}.warn{background:rgba(245,158,11,.12);color:var(--warn)}</style></head><body><main class="card"><h1>RC SPEED</h1><div class="row"><div><div class="part">P5</div><div class="tag">Excellent</div></div><div class="time">9:38</div></div><div class="row"><div><div class="part">P6</div><div class="tag">Good</div></div><div class="time">8:24</div></div><div class="row"><div><div class="part">P7</div><div class="tag warn">Need pace</div></div><div class="time">59:10</div></div></main></body></html>
