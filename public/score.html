<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCORE</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="./style.css">
<style>
  .head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; }
  .row { display: grid; grid-template-columns: 26px 1fr 78px; align-items: center; gap: 12px; margin: 8px 0; }
  .row .k { font-size: 11px; letter-spacing: 0.1em; font-weight: 600; }
  .row .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; position: relative; }
  .row .bar > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; transition: width .4s ease; }
  .lc .bar > i { background: var(--lc); }
  .rc .bar > i { background: var(--rc); }
  .row .v { font-size: 15px; font-weight: 600; text-align: right; }
  .row .v small { font-weight: 400; color: var(--ink-mute); font-size: 11px; margin-left: 2px; }
  .foot { display: flex; justify-content: space-between; align-items: baseline; margin-top: 14px; }
  .foot .total { font-size: 26px; font-weight: 700; }
  .foot .gap { font-size: 11px; color: var(--ink-mute); }
  .meta { font-size: 10px; color: var(--ink-mute); margin-top: 6px; }
</style>
</head>
<body>
<div class="head">
  <div>
    <div class="label">TOEIC · SCORE</div>
  </div>
  <button class="refresh" onclick="load()">↻</button>
</div>

<div id="body">
  <div class="row lc">
    <div class="k muted">LC</div>
    <div class="bar"><i id="lcBar"></i></div>
    <div class="v num"><span id="lc">—</span><small>/470</small></div>
  </div>
  <div class="row rc">
    <div class="k muted">RC</div>
    <div class="bar"><i id="rcBar"></i></div>
    <div class="v num"><span id="rc">—</span><small>/430</small></div>
  </div>
  <div class="hr"></div>
  <div class="foot">
    <div class="num total" id="total">—</div>
    <div class="gap num">목표 900 · <span id="gap">—</span></div>
  </div>
  <div class="meta" id="meta"></div>
</div>

<script>
async function load() {
  try {
    const r = await fetch('./data/score.json?t=' + Date.now());
    const d = await r.json();
    if (d.empty) {
      document.getElementById('body').innerHTML =
        '<div class="muted" style="font-size:12px;padding:20px 0;text-align:center">아직 모의고사 기록이 없습니다</div>';
      return;
    }
    document.getElementById('lc').textContent = d.lc ?? '—';
    document.getElementById('rc').textContent = d.rc ?? '—';
    document.getElementById('total').textContent = d.total ?? '—';
    document.getElementById('gap').textContent = d.total ? `-${900 - d.total}` : '—';
    document.getElementById('lcBar').style.width = Math.min(100, ((d.lc ?? 0) / 470) * 100) + '%';
    document.getElementById('rcBar').style.width = Math.min(100, ((d.rc ?? 0) / 430) * 100) + '%';
    if (d.회차 || d.응시일) {
      document.getElementById('meta').textContent = [d.회차, d.응시일].filter(Boolean).join(' · ');
    }
  } catch (e) {
    document.getElementById('body').innerHTML = '<div class="err">불러오기 실패</div>';
  }
}
load();
</script>
</body>
</html>
