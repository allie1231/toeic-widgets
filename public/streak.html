<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>Streak</title><style>:root{--bg:rgba(255,255,255,.78);--line:rgba(15,23,42,.09);--text:#111827;--muted:#6b7280;--a:#f97316;--b:#ef4444}@media(prefers-color-scheme:dark){:root{--bg:rgba(18,18,22,.8);--line:rgba(255,255,255,.1);--text:#f7f7f8;--muted:#a1a1aa}}*{box-sizing:border-box}body{margin:0;padding:8px;background:transparent;font-family:-apple-system,BlinkMacSystemFont,"Pretendard",sans-serif;color:var(--text)}.card{max-width:440px;margin:auto;padding:22px;border:1px solid var(--line);border-radius:24px;background:var(--bg);backdrop-filter:blur(22px);box-shadow:0 18px 44px rgba(15,23,42,.1);text-align:center}h1{margin:0;font-size:13px;letter-spacing:.12em;color:var(--muted)}.fire{margin-top:18px;font-size:48px;filter:drop-shadow(0 8px 18px rgba(249,115,22,.25));animation:float 2s ease-in-out infinite}.days{margin-top:8px;font-size:58px;line-height:1;font-weight:820;letter-spacing:-.06em;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;color:transparent}.sub{margin-top:8px;font-size:13px;color:var(--muted)}@keyframes float{50%{transform:translateY(-5px)}}</style></head><body><main class="card"><h1>STUDY STREAK</h1><div class="fire">🔥</div><div class="days">32</div><div class="sub">days · 최고 기록 42일</div></main></body></html>
