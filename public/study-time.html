<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>Study Time</title><style>:root{--bg:rgba(255,255,255,.78);--line:rgba(15,23,42,.09);--text:#111827;--muted:#6b7280;--track:rgba(17,24,39,.08);--a:#7c3aed;--b:#2563eb}@media(prefers-color-scheme:dark){:root{--bg:rgba(18,18,22,.8);--line:rgba(255,255,255,.1);--text:#f7f7f8;--muted:#a1a1aa;--track:rgba(255,255,255,.1)}}*{box-sizing:border-box}body{margin:0;padding:8px;background:transparent;font-family:-apple-system,BlinkMacSystemFont,"Pretendard",sans-serif;color:var(--text)}.card{max-width:440px;margin:auto;padding:22px;border:1px solid var(--line);border-radius:24px;background:var(--bg);backdrop-filter:blur(22px);box-shadow:0 18px 44px rgba(15,23,42,.1)}h1{margin:0;font-size:13px;letter-spacing:.12em;color:var(--muted)}.time{margin-top:18px;font-size:58px;line-height:1;font-weight:820;letter-spacing:-.06em}.sub{margin-top:8px;color:var(--muted);font-size:13px}.bars{display:flex;align-items:end;gap:8px;height:72px;margin-top:20px}.bar{flex:1;border-radius:8px 8px 4px 4px;background:linear-gradient(180deg,var(--a),var(--b));opacity:.8;animation:rise .9s cubic-bezier(.22,1,.36,1)}.labels{display:flex;justify-content:space-between;margin-top:8px;color:var(--muted);font-size:10px}@keyframes rise{from{height:0}}</style></head><body><main class="card"><h1>STUDY TIME</h1><div class="time">2h 14m</div><div class="sub">오늘 · 목표 3시간의 74%</div><div class="bars"><div class="bar" style="height:24%"></div><div class="bar" style="height:52%"></div><div class="bar" style="height:38%"></div><div class="bar" style="height:72%"></div><div class="bar" style="height:64%"></div><div class="bar" style="height:90%"></div><div class="bar" style="height:74%"></div></div><div class="labels"><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span><span>일</span></div></main></body></html>
