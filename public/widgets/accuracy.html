<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>파트별 정답률</title>
  <link rel="stylesheet" href="../assets/css/theme.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <script src="../assets/js/animation.js" defer></script>
  <script src="../assets/js/common.js" defer></script>
</head>
<body class="widget-page">
  <article class="widget-card" data-card data-animate aria-labelledby="widget-title">
    <header class="widget-header">
      <h1 class="widget-title" id="widget-title">Accuracy</h1>
      <span class="widget-meta">Last test</span>
    </header>

    <div class="accuracy-list">
      <div class="accuracy-item"><span class="accuracy-item__part">P5</span><div class="progress" data-progress="92" aria-label="파트 5 정답률 92%"><div class="progress__fill"></div></div><strong class="accuracy-item__value"><span data-counter="92" data-counter-suffix="%">92%</span></strong></div>
      <div class="accuracy-item"><span class="accuracy-item__part">P6</span><div class="progress" data-progress="84" aria-label="파트 6 정답률 84%"><div class="progress__fill"></div></div><strong class="accuracy-item__value"><span data-counter="84" data-counter-suffix="%">84%</span></strong></div>
      <div class="accuracy-item"><span class="accuracy-item__part">P7</span><div class="progress" data-progress="73" aria-label="파트 7 정답률 73%"><div class="progress__fill"></div></div><strong class="accuracy-item__value"><span data-counter="73" data-counter-suffix="%">73%</span></strong></div>
    </div>
  </article>
</body>
</html>
