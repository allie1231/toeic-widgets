<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>TOEIC AI 코치</title>
  <link rel="stylesheet" href="../assets/css/theme.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <script src="../assets/js/animation.js" defer></script>
  <script src="../assets/js/common.js" defer></script>
</head>
<body class="widget-page">
  <article class="widget-card" data-card data-animate aria-labelledby="widget-title">
    <header class="widget-header">
      <h1 class="widget-title" id="widget-title">AI Coach · Today</h1>
      <time class="widget-meta" datetime="2026-08-04">2026.08.04</time>
    </header>

    <section class="coach-focus" aria-label="오늘의 학습 초점">
      <h2 class="coach-skill">형용사</h2>
      <span class="pill">25 min</span>
    </section>

    <section class="inset-panel" aria-labelledby="mission-title">
      <h2 class="eyebrow" id="mission-title">Today's Mission</h2>
      <p>형용사 품사자리 오답을 복습하고 P5 20초 타임어택 10문제를 풉니다.</p>
    </section>

    <dl class="stats-grid">
      <div class="stat-box"><dt>Review</dt><dd>1문제</dd></div>
      <div class="stat-box"><dt>Pace</dt><dd>수집 중</dd></div>
      <div class="stat-box"><dt>Focus</dt><dd>P5</dd></div>
    </dl>
  </article>
</body>
</html>
