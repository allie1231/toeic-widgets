<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>점수 목표</title>
  <link rel="stylesheet" href="../assets/css/theme.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <script src="../assets/js/animation.js" defer></script>
  <script src="../assets/js/common.js" defer></script>
</head>
<body class="widget-page">
  <article class="widget-card" data-card data-animate aria-labelledby="widget-title">
    <header class="widget-header">
      <h1 class="widget-title" id="widget-title">Goal Progress</h1>
      <span class="widget-meta">725 current</span>
    </header>

    <div class="goal-list">
      <div class="goal-item"><span class="goal-item__score">760</span><div class="progress" data-progress="95" aria-label="760점 목표 95%"><div class="progress__fill"></div></div><span class="goal-item__percent">95%</span></div>
      <div class="goal-item"><span class="goal-item__score">800</span><div class="progress" data-progress="74" aria-label="800점 목표 74%"><div class="progress__fill"></div></div><span class="goal-item__percent">74%</span></div>
      <div class="goal-item"><span class="goal-item__score">850</span><div class="progress" data-progress="56" aria-label="850점 목표 56%"><div class="progress__fill"></div></div><span class="goal-item__percent">56%</span></div>
      <div class="goal-item"><span class="goal-item__score">900</span><div class="progress" data-progress="0" aria-label="900점 목표 0%"><div class="progress__fill"></div></div><span class="goal-item__percent">0%</span></div>
    </div>
  </article>
</body>
</html>
