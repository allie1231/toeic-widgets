<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>학습 히트맵</title>
  <link rel="stylesheet" href="../assets/css/theme.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <script src="../assets/js/animation.js" defer></script>
  <script src="../assets/js/common.js" defer></script>
</head>
<body class="widget-page">
  <article class="widget-card" data-card data-animate data-source="../data/heatmap.json" aria-labelledby="widget-title">
    <div class="widget-content">
      <header class="widget-header">
        <h1 class="widget-title" id="widget-title">Study Heatmap</h1>
        <span class="widget-meta" data-bind="periodLabel"></span>
      </header>

      <div class="widget-row heatmap-meta"><strong data-bind="studyLabel"></strong><span class="widget-meta" data-bind="ratioLabel"></span></div>
      <div class="heatmap" data-heatmap-bind="levels" aria-hidden="true"></div>
      <p class="sr-only" data-bind="summary"></p>
    </div>
  </article>
</body>
</html>
