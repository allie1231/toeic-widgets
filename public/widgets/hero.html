<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>TOEIC 목표 점수 진행률</title>
  <link rel="stylesheet" href="../assets/css/theme.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <script src="../assets/js/animation.js" defer></script>
  <script src="../assets/js/common.js" defer></script>
</head>
<body class="widget-page">
  <article class="widget-card" data-card data-animate aria-labelledby="widget-title">
    <header class="widget-header">
      <h1 class="widget-title" id="widget-title">TOEIC 900 Project</h1>
      <span class="pill">RC Focus</span>
    </header>

    <div class="score-lockup" aria-label="현재 점수 725점, 목표 점수 900점">
      <strong class="metric-large" data-counter="725">725</strong>
      <span class="score-lockup__arrow" aria-hidden="true">→</span>
      <span class="score-lockup__target">900</span>
    </div>

    <div class="progress progress--large hero-progress" data-progress="80.6" aria-label="목표 점수 진행률">
      <div class="progress__fill"></div>
    </div>

    <footer class="widget-row hero-footer">
      <strong><span data-counter="80.6" data-counter-decimals="1" data-counter-suffix="%">80.6%</span></strong>
      <p class="widget-meta">175 points left</p>
    </footer>
  </article>
</body>
</html>
