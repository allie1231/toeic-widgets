<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>RC 풀이 속도</title>
  <link rel="stylesheet" href="../assets/css/theme.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <script src="../assets/js/animation.js" defer></script>
  <script src="../assets/js/common.js" defer></script>
</head>
<body class="widget-page">
  <article class="widget-card" data-card data-animate aria-labelledby="widget-title">
    <header class="widget-header">
      <h1 class="widget-title" id="widget-title">RC Speed</h1>
      <span class="widget-meta">75 min total</span>
    </header>

    <div class="timing-list">
      <section class="timing-row" aria-label="파트 5, 9분 38초, 매우 좋음"><div class="timing-row__part">P5 <span class="status-tag status-tag--success">Excellent</span></div><strong class="metric-medium">9:38</strong></section>
      <section class="timing-row" aria-label="파트 6, 8분 24초, 좋음"><div class="timing-row__part">P6 <span class="status-tag status-tag--success">Good</span></div><strong class="metric-medium">8:24</strong></section>
      <section class="timing-row" aria-label="파트 7, 59분 10초, 속도 개선 필요"><div class="timing-row__part">P7 <span class="status-tag status-tag--warning">Need pace</span></div><strong class="metric-medium">59:10</strong></section>
    </div>
  </article>
</body>
</html>
