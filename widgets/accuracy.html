<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>파트별 정답률</title>
  <link rel="stylesheet" href="../assets/css/theme.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <script src="../assets/js/animation.js" defer></script>
  <script src="../assets/js/common.js" defer></script>
</head>
<body class="widget-page">
  <article class="widget-card" data-card data-animate data-source="../data/accuracy.json" aria-labelledby="widget-title">
    <div class="widget-content">
      <header class="widget-header">
        <h1 class="widget-title" id="widget-title">Accuracy</h1>
        <span class="widget-meta" data-bind="periodLabel"></span>
      </header>

      <div class="accuracy-list">
        <template data-repeat="parts">
          <div class="accuracy-item"><span class="accuracy-item__part" data-bind="name"></span><div class="progress" data-progress-bind="accuracy" data-bind-aria-label="ariaLabel"><div class="progress__fill"></div></div><strong class="accuracy-item__value"><span data-counter-bind="accuracy" data-counter-suffix="%"></span></strong></div>
        </template>
      </div>
    </div>
  </article>
</body>
</html>
