<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>TOEIC AI 코치</title>
  <link rel="stylesheet" href="../assets/css/theme.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <script src="../assets/js/animation.js" defer></script>
  <script src="../assets/js/common.js" defer></script>
</head>
<body class="widget-page">
  <article class="card" data-card data-animate data-source="../data/coach.json" aria-labelledby="widget-title">
    <div class="card__content">
      <header class="header">
        <h1 class="header__title" id="widget-title">AI Coach · Today</h1>
        <time class="widget-meta" data-bind="dateLabel" data-bind-datetime="date"></time>
      </header>

      <section class="coach-focus" aria-label="오늘의 학습 초점">
        <h2 class="coach-skill" data-bind="focusSkill"></h2>
        <span class="chip" data-bind="durationLabel"></span>
      </section>

      <section class="inset-panel" aria-labelledby="mission-title">
        <h2 class="eyebrow" id="mission-title">Today's Mission</h2>
        <p data-bind="mission"></p>
      </section>

      <dl class="stats-grid">
        <template data-repeat="metrics">
          <div class="stat-box"><dt data-bind="label"></dt><dd data-bind="value"></dd></div>
        </template>
      </dl>
    </div>
  </article>
</body>
</html>
