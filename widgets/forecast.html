<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="TOEIC 점수 추세와 예상 점수를 보여 주는 Notion 임베드 위젯">
  <title>점수 예측</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/css/theme.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <script src="../assets/js/animation.js" defer></script>
  <script src="../assets/js/common.js" defer></script>
</head>
<body class="widget-page">
  <article class="card" data-card data-animate data-source="../data/forecast.json" aria-labelledby="widget-title">
    <div class="card__content">
      <header class="header">
        <h1 class="header__title" id="widget-title">Score Forecast</h1>
        <span class="chip" data-bind="trendLabel"></span>
      </header>

      <p class="metric-large" data-counter-bind="score"></p>
      <p class="supporting-text" data-bind="summary"></p>

      <div class="forecast-chart" data-line-chart-bind="history" aria-hidden="true">
        <svg viewBox="0 0 360 90" preserveAspectRatio="none">
          <defs>
            <linearGradient id="forecast-line" x1="0" x2="1"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
            <linearGradient id="forecast-area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#2563eb" stop-opacity="0"/></linearGradient>
          </defs>
          <path class="forecast-chart__area" data-chart-area/>
          <path class="forecast-chart__line" data-chart-line/>
          <circle class="forecast-chart__dot" data-chart-dot r="5"/>
        </svg>
      </div>
      <p class="sr-only" data-bind="chartSummary"></p>
    </div>
  </article>
</body>
</html>
