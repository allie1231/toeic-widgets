<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="TOEIC 학습 목표의 진행 상태를 보여 주는 Notion 임베드 위젯">
  <title>점수 목표</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/css/theme.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <script src="../assets/js/animation.js" defer></script>
  <script src="../assets/js/common.js" defer></script>
</head>
<body class="widget-page">
  <article class="card" data-card data-animate data-source="../data/goals.json" aria-labelledby="widget-title">
    <div class="card__content">
      <header class="header">
        <h1 class="header__title" id="widget-title">Goal Progress</h1>
        <span class="widget-meta" data-bind="currentLabel"></span>
      </header>

      <div class="goal-list">
        <template data-repeat="goals">
          <div class="goal-item"><span class="goal-item__score" data-bind="target"></span><div class="progress" data-progress-bind="progress" data-bind-aria-label="ariaLabel"><div class="progress__fill"></div></div><span class="goal-item__percent" data-bind="percentLabel"></span></div>
        </template>
      </div>
    </div>
  </article>
</body>
</html>
