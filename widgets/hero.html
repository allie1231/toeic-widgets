<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>TOEIC 목표 점수 진행률</title>
  <link rel="stylesheet" href="../assets/css/theme.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <script src="../assets/js/animation.js" defer></script>
  <script src="../assets/js/common.js" defer></script>
</head>
<body class="widget-page">
  <article class="widget-card" data-card data-animate data-source="../data/hero.json" aria-labelledby="widget-title">
    <div class="widget-content">
      <header class="widget-header">
        <h1 class="widget-title" id="widget-title" data-bind="title"></h1>
        <span class="pill" data-bind="focus"></span>
      </header>

      <div class="score-lockup" data-bind-aria-label="scoreAriaLabel">
        <strong class="metric-large" data-counter-bind="current"></strong>
        <span class="score-lockup__arrow" aria-hidden="true">→</span>
        <span class="score-lockup__target" data-bind="target"></span>
      </div>

      <div class="progress progress--large hero-progress" data-progress-bind="progress" data-bind-aria-label="progressAriaLabel">
        <div class="progress__fill"></div>
      </div>

      <footer class="widget-row hero-footer">
        <strong><span data-counter-bind="progress" data-counter-decimals="1" data-counter-suffix="%"></span></strong>
        <p class="widget-meta" data-bind="remaining" data-bind-suffix=" points left"></p>
      </footer>
    </div>
  </article>
</body>
</html>
