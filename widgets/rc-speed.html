<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>RC 풀이 속도</title>
  <link rel="stylesheet" href="../assets/css/theme.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <script src="../assets/js/animation.js" defer></script>
  <script src="../assets/js/common.js" defer></script>
</head>
<body class="widget-page">
  <article class="widget-card" data-card data-animate data-source="../data/rc-speed.json" aria-labelledby="widget-title">
    <div class="widget-content">
      <header class="widget-header">
        <h1 class="widget-title" id="widget-title">RC Speed</h1>
        <span class="widget-meta" data-bind="totalLabel"></span>
      </header>

      <div class="timing-list">
        <template data-repeat="parts">
          <section class="timing-row" data-bind-aria-label="ariaLabel"><div class="timing-row__part"><span data-bind="name"></span><span class="status-tag" data-bind="status" data-class-bind="tone" data-class-prefix="status-tag--"></span></div><strong class="metric-medium" data-bind="time"></strong></section>
        </template>
      </div>
    </div>
  </article>
</body>
</html>
