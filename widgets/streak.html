<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="TOEIC 연속 학습 기록을 보여 주는 Notion 임베드 위젯">
  <title>연속 학습</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/css/theme.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <script src="../assets/js/animation.js" defer></script>
  <script src="../assets/js/common.js" defer></script>
</head>
<body class="widget-page">
  <article class="card streak-card" data-card data-animate data-source="../data/streak.json" data-bind-aria-label="ariaLabel" aria-labelledby="widget-title">
    <div class="card__content">
      <header><h1 class="header__title" id="widget-title">Study Streak</h1></header>
      <div class="streak-icon" data-bind="icon" aria-hidden="true"></div>
      <p class="metric-large streak-days"><span data-counter-bind="days"></span></p>
      <p class="supporting-text"><span data-bind="unitLabel"></span> · <span data-bind="bestLabel"></span></p>
      <p class="sr-only" data-bind="ariaLabel"></p>
    </div>
  </article>
</body>
</html>
