<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>학습 시간</title>
  <link rel="stylesheet" href="../assets/css/theme.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <script src="../assets/js/animation.js" defer></script>
  <script src="../assets/js/common.js" defer></script>
</head>
<body class="widget-page">
  <article class="card" data-card data-animate data-source="../data/study.json" aria-labelledby="widget-title">
    <div class="card__content">
      <header class="header">
        <h1 class="header__title" id="widget-title">Study Time</h1>
        <span class="widget-meta" data-bind="periodLabel"></span>
      </header>

      <p class="metric-large" data-bind-aria-label="durationAriaLabel"><span data-counter-bind="hours"></span>h <span data-counter-bind="minutes"></span>m</p>
      <p class="supporting-text" data-bind="summary"></p>

      <div class="bar-chart" aria-hidden="true">
        <template data-repeat="days"><span class="bar-chart__bar" data-bar-bind="percent"></span></template>
      </div>
      <div class="bar-chart__labels" aria-hidden="true">
        <template data-repeat="days"><span data-bind="label"></span></template>
      </div>
      <p class="sr-only" data-bind="chartSummary"></p>
    </div>
  </article>
</body>
</html>
