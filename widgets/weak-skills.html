<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>취약 영역</title>
  <link rel="stylesheet" href="../assets/css/theme.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <script src="../assets/js/animation.js" defer></script>
  <script src="../assets/js/common.js" defer></script>
</head>
<body class="widget-page">
  <article class="card" data-card data-animate data-source="../data/skills.json" aria-labelledby="widget-title">
    <div class="card__content">
      <header class="header">
        <h1 class="header__title" id="widget-title">Weak Skills</h1>
        <span class="widget-meta" data-bind="periodLabel"></span>
      </header>

      <ol class="list">
        <template data-repeat="skills">
          <li class="list-item" data-bind-aria-label="ariaLabel">
            <div class="list-item__header"><span class="list-item__label" data-bind="name"></span><span class="list-item__value" data-bind="countLabel"></span></div>
            <div class="progress" data-progress-bind="level" data-bind-aria-label="progressAriaLabel"><div class="progress__fill"></div></div>
          </li>
        </template>
      </ol>
    </div>
  </article>
</body>
</html>
